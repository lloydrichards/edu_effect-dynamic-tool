name: bevr-app
services:
  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY?Missing ANTHROPIC_API_KEY}
      PORT: ${SERVER_PORT:-9000}
      HOST: 0.0.0.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${CLIENT_PORT:-3000}}
      LOCAL_MCP_URL: http://server-mcp:9009/mcp
    expose:
      - "${SERVER_PORT:-9000}"
    networks:
      - app-network

  server-mcp:
    build:
      context: .
      dockerfile: ./apps/server-mcp/Dockerfile
    environment:
      MCP_PORT: 9009
    expose:
      - "9009"
    networks:
      - app-network

  client:
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
      args:
        SERVER_URL: ${SERVER_URL:-http://localhost:${SERVER_PORT:-9000}}
        CLIENT_PORT: ${CLIENT_PORT:-3000}
    ports:
      - "${CLIENT_PORT:-3000}:${CLIENT_PORT:-3000}"
    networks:
      - app-network
    depends_on:
      - server
      - server-mcp

networks:
  app-network:
    driver: bridge
