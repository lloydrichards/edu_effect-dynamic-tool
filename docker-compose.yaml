name: bevr-app
services:
  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY?Missing ANTHROPIC_API_KEY}
      PORT: 9000
      HOST: 0.0.0.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOCAL_MCP_URL: http://server-mcp:9009/mcp
    expose:
      - "9000"
    networks:
      - app-network

  server-mcp:
    build:
      context: .
      dockerfile: ./apps/server-mcp/Dockerfile
    environment:
      MCP_PORT: 9009
    expose:
      - "9009"
    networks:
      - app-network

  client:
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
      args:
        SERVER_URL: ${SERVER_URL:-http://localhost:3000}
    ports:
      - "3000:80"
    networks:
      - app-network
    depends_on:
      - server
      - server-mcp

networks:
  app-network:
    driver: bridge
